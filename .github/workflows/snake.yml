name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4a0a&color_dots=#ebedf0,#ffd2b8,#ff9a5c,#ff5a12,#b32200
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffb21f&color_dots=#161b22,#4a0d02,#8a1c03,#d63a00,#ff8a1f

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
